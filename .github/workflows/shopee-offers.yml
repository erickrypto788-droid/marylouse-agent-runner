name: Shopee ofertas

run-name: Shopee - ${{ github.event.inputs.post_count || '5' }} produto(s)

on:
  workflow_dispatch:
    inputs:
      post_count:
        description: "Quantidade de produtos Shopee"
        required: true
        default: "5"
      force_group:
        description: "Forçar grupo Shopee opcional. Ex: shopee_roupas_femininas"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: marylouse-shopee
  cancel-in-progress: false

jobs:
  shopee:
    name: Rodar Shopee independente
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório do agente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests PyYAML python-dotenv
          fi

      - name: Baixar repositório público do site
        uses: actions/checkout@v4
        with:
          repository: erickrypto788-droid/marylouse-ofertas
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site_live
          fetch-depth: 0

      - name: Preparar dados atuais do site
        run: |
          mkdir -p site/data

          if [ -f site_live/data/offers.json ]; then
            cp site_live/data/offers.json site/data/offers.json
          else
            echo "[]" > site/data/offers.json
          fi

          if [ -f site_live/data/coupons.json ]; then
            cp site_live/data/coupons.json site/data/coupons.json
          else
            echo "[]" > site/data/coupons.json
          fi

      - name: Configurar Shopee independente
        env:
          POST_COUNT: ${{ github.event.inputs.post_count || '5' }}
          FORCE_SHOPEE_GROUP: ${{ github.event.inputs.force_group || '' }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          from pathlib import Path
          import yaml

          post_count = int(os.getenv("POST_COUNT", "5"))
          force_group = os.getenv("FORCE_SHOPEE_GROUP", "").strip()

          groups = {
              "shopee_roupas_femininas": {
                  "name": "Roupas Femininas",
                  "category_label": "Moda Feminina",
                  "keywords": [
                      "vestido feminino",
                      "blusa feminina",
                      "cropped feminino",
                      "calça feminina",
                      "legging feminina",
                      "shorts feminino",
                      "top feminino",
                      "conjunto feminino",
                      "regata feminina",
                      "moda feminina",
                      "roupas femininas"
                  ],
              },
              "shopee_roupas_masculinas": {
                  "name": "Roupas Masculinas",
                  "category_label": "Moda Masculina",
                  "keywords": [
                      "camiseta masculina",
                      "camisa masculina",
                      "bermuda masculina",
                      "calça masculina",
                      "cueca masculina",
                      "moda masculina",
                      "roupas masculinas"
                  ],
              },
              "shopee_roupas_plus_size": {
                  "name": "Roupas Plus Size",
                  "category_label": "Moda Plus Size",
                  "keywords": [
                      "moda plus size",
                      "vestido plus size",
                      "blusa plus size",
                      "calça plus size",
                      "legging plus size",
                      "roupas plus size"
                  ],
              },
              "shopee_sapatos_masculinos": {
                  "name": "Sapatos Masculinos",
                  "category_label": "Calçados",
                  "keywords": [
                      "tênis masculino",
                      "sapato masculino",
                      "sapatênis masculino",
                      "chinelo masculino",
                      "bota masculina"
                  ],
              },
              "shopee_sapatos_femininos": {
                  "name": "Sapatos Femininos",
                  "category_label": "Calçados",
                  "keywords": [
                      "tênis feminino",
                      "sapato feminino",
                      "sandália feminina",
                      "chinelo feminino",
                      "bota feminina",
                      "rasteirinha feminina"
                  ],
              },
              "shopee_celulares": {
                  "name": "Celulares e Dispositivos",
                  "category_label": "Celulares",
                  "keywords": [
                      "smartphone",
                      "celular xiaomi",
                      "celular samsung",
                      "iphone",
                      "motorola",
                      "carregador celular",
                      "fone bluetooth"
                  ],
              },
              "shopee_eletrodomesticos": {
                  "name": "Eletrodomésticos",
                  "category_label": "Eletrodomésticos",
                  "keywords": [
                      "air fryer",
                      "liquidificador",
                      "cafeteira",
                      "ventilador",
                      "aspirador de pó",
                      "microondas",
                      "panela elétrica"
                  ],
              },
              "shopee_beleza": {
                  "name": "Beleza",
                  "category_label": "Beleza",
                  "keywords": [
                      "perfume feminino",
                      "perfume masculino",
                      "secador de cabelo",
                      "chapinha",
                      "escova secadora",
                      "maquiagem",
                      "skincare",
                      "protetor solar"
                  ],
              },
              "shopee_moda_infantil": {
                  "name": "Moda Infantil",
                  "category_label": "Moda Infantil",
                  "keywords": [
                      "roupa infantil",
                      "moda infantil",
                      "vestido infantil",
                      "camiseta infantil",
                      "calçado infantil",
                      "tênis infantil"
                  ],
              },
              "shopee_esportes_lazer": {
                  "name": "Esportes e Lazer",
                  "category_label": "Esportes",
                  "keywords": [
                      "halteres",
                      "academia",
                      "fitness",
                      "bicicleta",
                      "bola futebol",
                      "garrafa térmica academia",
                      "whey",
                      "creatina"
                  ],
              },
              "shopee_brinquedos_hobbies": {
                  "name": "Brinquedos e Hobbies",
                  "category_label": "Brinquedos e Hobbies",
                  "keywords": [
                      "brinquedo infantil",
                      "hot wheels",
                      "lego",
                      "boneca",
                      "boneco",
                      "jogo educativo",
                      "carrinho brinquedo"
                  ],
              },
              "shopee_saude": {
                  "name": "Saúde",
                  "category_label": "Saúde",
                  "keywords": [
                      "monitor de pressão",
                      "termômetro digital",
                      "inalador",
                      "nebulizador",
                      "oxímetro",
                      "balança digital",
                      "medidor de glicose"
                  ],
              },
              "shopee_mae_bebe": {
                  "name": "Mãe e Bebê",
                  "category_label": "Mãe e Bebê",
                  "keywords": [
                      "fralda",
                      "fralda pampers",
                      "fralda huggies",
                      "lenço umedecido",
                      "mamadeira",
                      "chupeta",
                      "carrinho de bebê",
                      "berço portátil"
                  ],
              },
              "shopee_bolsas_femininas": {
                  "name": "Bolsas Femininas",
                  "category_label": "Bolsas",
                  "keywords": [
                      "bolsa feminina",
                      "bolsa transversal feminina",
                      "mochila feminina",
                      "mala feminina",
                      "necessaire feminina"
                  ],
              },
              "shopee_bolsas_masculinas": {
                  "name": "Bolsas Masculinas",
                  "category_label": "Bolsas",
                  "keywords": [
                      "mochila masculina",
                      "bolsa masculina",
                      "mala masculina",
                      "pochete masculina",
                      "carteira masculina"
                  ],
              },
              "shopee_papelaria": {
                  "name": "Papelaria",
                  "category_label": "Papelaria",
                  "keywords": [
                      "caneta",
                      "caderno",
                      "estojo",
                      "material escolar",
                      "papelaria",
                      "marca texto",
                      "agenda"
                  ],
              },
              "shopee_informatica": {
                  "name": "Computadores e Acessórios",
                  "category_label": "Informática",
                  "keywords": [
                      "notebook",
                      "mouse gamer",
                      "teclado gamer",
                      "monitor gamer",
                      "ssd",
                      "hub usb",
                      "webcam",
                      "roteador"
                  ],
              },
              "shopee_bebidas_alimentos": {
                  "name": "Bebidas e Alimentos",
                  "category_label": "Supermercados",
                  "keywords": [
                      "café",
                      "leite em pó",
                      "chocolate",
                      "azeite",
                      "arroz",
                      "feijão",
                      "suplemento alimentar"
                  ],
              },
              "shopee_jogos_consoles": {
                  "name": "Jogos e Consoles",
                  "category_label": "Games",
                  "keywords": [
                      "controle ps5",
                      "controle xbox",
                      "nintendo switch",
                      "console portátil",
                      "jogo ps5",
                      "headset gamer"
                  ],
              },
          }

          state_path = Path("data/shopee_workflow_state.json")
          state_path.parent.mkdir(parents=True, exist_ok=True)

          if force_group:
              if force_group not in groups:
                  available = ", ".join(groups.keys())
                  raise SystemExit(
                      f"FORCE_SHOPEE_GROUP não encontrado: {force_group}. "
                      f"Disponíveis: {available}"
                  )

              selected_key = force_group
              selected_group = groups[force_group]
              print(f"[workflow-shopee] Grupo Shopee forçado: {selected_group.get('name') or selected_key} ({selected_key})")

          else:
              try:
                  state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
              except Exception:
                  state = {}

              keys = list(groups.keys())
              index = int(state.get("next_index", 0)) % len(keys)
              selected_key = keys[index]
              selected_group = groups[selected_key]

              state["next_index"] = (index + 1) % len(keys)
              state["last_key"] = selected_key
              state["last_name"] = selected_group.get("name") or selected_key
              state["updated_at"] = int(time.time())

              state_path.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

          path = Path("config.yaml")
          cfg = yaml.safe_load(path.read_text(encoding="utf-8")) or {}

          # Desativa rotação global.
          cfg.setdefault("niches", {})["enabled"] = False
          cfg["active_niche"] = {
              "key": selected_key,
              "name": selected_group.get("name") or selected_key
          }

          agent = cfg.setdefault("agent", {})
          agent["dry_run"] = False
          agent["post_one_per_marketplace"] = True
          agent["posts_per_marketplace"] = post_count
          agent["post_limit_per_run"] = post_count
          agent["posts_per_marketplace_by_marketplace"] = {
              "shopee": post_count
          }

          marketplaces = cfg.setdefault("marketplaces", {})

          for name, mcfg in marketplaces.items():
              if isinstance(mcfg, dict):
                  mcfg["enabled"] = str(name).strip().lower() == "shopee"

          shopee = marketplaces.setdefault("shopee", {})
          shopee["enabled"] = True
          shopee["keywords"] = selected_group["keywords"]
          shopee["category_label"] = selected_group.get("category_label") or selected_group.get("name")
          shopee["posts_per_run"] = post_count

          filters = cfg.setdefault("filters", {})
          filters["allowed_marketplaces"] = ["shopee"]

          path.write_text(
              yaml.safe_dump(
                  cfg,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              ),
              encoding="utf-8"
          )

          print(
              f"[workflow-shopee] Nicho ativo: {selected_group.get('name') or selected_key} "
              f"({selected_key}) | {len(selected_group['keywords'])} keywords"
          )
          print(f"[workflow-shopee] post_count={post_count}")
          print("[workflow-shopee] Shopee independente configurado.")
          PY

      - name: Testar sintaxe Python
        run: |
          python -m py_compile src/copywriter.py
          python -m py_compile src/agent.py
          python -m py_compile src/scoring.py
          python -m py_compile src/site_publisher.py

      - name: Rodar agente Shopee
        env:
          DRY_RUN: "false"

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          python run.py --once --post

      - name: Atualizar ofertas no repositório do site
        run: |
          mkdir -p site_live/data
          cp site/data/offers.json site_live/data/offers.json

      - name: Commit e push no site público
        working-directory: site_live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add data/offers.json
            git commit -m "Atualiza ofertas Shopee"
            git push
          else
            echo "Sem alterações no site público."
          fi

      - name: Persistir estado do agente
        continue-on-error: true
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_FILES=(
            "data/telegram_post_history.json"
            "data/agent.sqlite3"
            "data/shopee_workflow_state.json"
          )

          mkdir -p data
          mkdir -p /tmp/marylouse-state

          for file in "${STATE_FILES[@]}"; do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/marylouse-state/$(basename "$file")"
            fi
          done

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data

          for file in "${STATE_FILES[@]}"; do
            base="$(basename "$file")"

            if [ -f "/tmp/marylouse-state/$base" ]; then
              cp "/tmp/marylouse-state/$base" "$file"
            fi
          done

          git add "${STATE_FILES[@]}" || true

          if [ -n "$(git status --porcelain -- "${STATE_FILES[@]}")" ]; then
            git commit -m "Atualiza estado Shopee [skip ci]" || true
            git push || true
          else
            echo "Sem alterações no estado Shopee."
          fi
