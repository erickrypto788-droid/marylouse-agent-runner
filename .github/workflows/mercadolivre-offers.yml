name: Mercado Livre ofertas

on:
  workflow_dispatch:
    inputs:
      post_count:
        description: "Quantidade de ofertas para postar"
        required: false
        default: "5"
      force_group:
        description: "Forçar grupo ML opcional. Ex: moda_feminina"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mercadolivre-offers
  cancel-in-progress: false

jobs:
  mercadolivre-offers:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar runner
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar Mercado Livre independente
        env:
          POST_COUNT: ${{ github.event.inputs.post_count || '5' }}
          FORCE_ML_GROUP: ${{ github.event.inputs.force_group || '' }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}

          MERCADOLIVRE_CLIENT_ID: ${{ secrets.MERCADOLIVRE_CLIENT_ID }}
          MERCADOLIVRE_CLIENT_SECRET: ${{ secrets.MERCADOLIVRE_CLIENT_SECRET }}
          MERCADOLIVRE_REFRESH_TOKEN: ${{ secrets.MERCADOLIVRE_REFRESH_TOKEN }}
          MERCADOLIVRE_MATT_WORD: ${{ secrets.MERCADOLIVRE_MATT_WORD }}
          MERCADOLIVRE_MATT_TOOL: ${{ secrets.MERCADOLIVRE_MATT_TOOL }}

          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("config.yaml")
          cfg = yaml.safe_load(path.read_text(encoding="utf-8"))

          # Desativa rotação global de nichos.
          cfg.setdefault("niches", {})["enabled"] = False

          agent = cfg.setdefault("agent", {})
          agent["dry_run"] = False
          agent["post_one_per_marketplace"] = True
          agent.setdefault("posts_per_marketplace_by_marketplace", {})
          agent["posts_per_marketplace_by_marketplace"]["mercadolivre"] = int(os.getenv("POST_COUNT", "5"))
          agent["posts_per_marketplace_by_marketplace"]["shopee"] = 0
          agent["posts_per_marketplace_by_marketplace"]["aliexpress"] = 0

          marketplaces = cfg.setdefault("marketplaces", {})

          for name, mcfg in marketplaces.items():
              if isinstance(mcfg, dict):
                  mcfg["enabled"] = name == "mercadolivre"

          ml = marketplaces.setdefault("mercadolivre", {})
          ml["enabled"] = True
          ml["posts_per_run"] = int(os.getenv("POST_COUNT", "5"))
          ml["niche_groups_per_run"] = 1
          ml["niche_mode"] = "sequential"
          ml["niche_state_file"] = "data/mercadolivre_niche_state.json"

          ml["matt_word"] = os.getenv("MERCADOLIVRE_MATT_WORD", "marylouse") or "marylouse"
          ml["matt_tool"] = os.getenv("MERCADOLIVRE_MATT_TOOL", "50459180") or "50459180"

          force_group = os.getenv("FORCE_ML_GROUP", "").strip()

          if force_group:
              groups = ml.get("keyword_groups") or {}

              if force_group not in groups:
                  raise SystemExit(f"FORCE_ML_GROUP não encontrado em keyword_groups: {force_group}")

              forced = groups.get(force_group) or {}

              for key, group in groups.items():
                  if isinstance(group, dict):
                      group["enabled"] = (key == force_group)

              ml["niche_groups_per_run"] = 1
              ml["niche_mode"] = "sequential"

              print(f"[workflow-mercadolivre] Grupo ML forçado: {forced.get('name') or force_group} ({force_group})")

          path.write_text(yaml.safe_dump(cfg, allow_unicode=True, sort_keys=False), encoding="utf-8")

          print("[workflow-mercadolivre] Mercado Livre independente configurado.")
          PY

      - name: Rodar Mercado Livre
        run: |
          python run.py --once --post

      - name: Salvar estados do runner
        run: |
          git config user.name "marylouse-bot"
          git config user.email "marylouse-bot@users.noreply.github.com"

          git add data/mercadolivre_niche_state.json || true
          git add data/mercadolivre_quality_state.json || true
          git add data/agent.sqlite3 || true

          if git diff --cached --quiet; then
            echo "Nenhuma mudança de estado para salvar."
            exit 0
          fi

          git commit -m "Atualiza estado Mercado Livre"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push falhou. Tentativa $i/3..."
            sleep 5
          done

          echo "Falha ao salvar estado após 3 tentativas."
          exit 1
